<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; display: flex; justify-content: center; align-items: center; height: 100%; font-family: sans-serif; background-color: #f8fafc; color: #64748b;">
    <div id="status">Carregando portfólio...</div>

    <!-- Carrega e executa diretamente o binário compilado Wasm -->
    <script type="module">
        import init from 'https://brunowil.github.io/Portifolio/pkg/portfolio_wasm.js';
        init().catch(error => {
            document.getElementById('status').innerText = "Erro ao carregar a lógica compilada (Wasm).";
            console.error(error);
        });
    </script>
</body>
</html>
