<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunoWil | Portfólio</title>
    <style>
        /* Tela de carregamento simples antes do Rust injetar o layout */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: normal;
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #0f172a;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader">
        <div class="spinner"></div>
        <h2>Buscando dados do portfólio...</h2>
    </div>

    <script type="module">
        // Importa o inicializador gerado pelo seu comando `wasm-pack build --target web`
        // IMPORTANTE: Altere "portfolio_wasm" para o nome exato do "name" que está no seu Cargo.toml
        import init from './pkg/portfolio_wasm.js';

        async function run() {
            try {
                // Inicializa o Wasm (o macro #[wasm_bindgen(start)] executa aqui)
                await init();
            } catch (err) {
                console.error("Erro ao carregar o WebAssembly:", err);
            }
        }

        run();
    </script>
</body>
</html>
